<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .success {
            border-color: green;
            background-color: #d4edda;
        }
        .error {
            border-color: red;
            background-color: #f8d7da;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h1>API Test - Channel Analysis</h1>
    
    <form id="testForm">
        <div>
            <label for="channelUrl">Channel URL:</label>
            <input type="text" id="channelUrl" value="https://youtube.com/channel/test" required>
        </div>
        
        <div>
            <label for="analysisType">Analysis Type:</label>
            <select id="analysisType">
                <option value="basic">Basic</option>
                <option value="detailed">Detailed</option>
                <option value="competitor">Competitor</option>
            </select>
        </div>
        
        <button type="submit">Test API</button>
    </form>
    
    <div id="result" class="test-result"></div>
    
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            resultDiv.className = 'test-result';
            
            const channelUrl = document.getElementById('channelUrl').value;
            const analysisType = document.getElementById('analysisType').value;
            
            try {
                const response = await fetch('http://localhost:3000/api/v1/channel-analysis/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        channelUrl,
                        analysisType
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h3>Success!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h3>Error: ${response.status}</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <h3>Request Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
